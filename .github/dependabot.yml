version: 2
updates:
    # pnpm workspace（ルート / template/tanstack-workers / template/content-worker）は
    # ルートの pnpm-lock.yaml 1 つで管理されているので "/" だけで全体が対象になる。
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      # pnpm 12 の minimumReleaseAge (既定 1 日) より新しい版は lockfile に入れられないので揃える
      cooldown:
          default-days: 1
      groups:
          npm-minor-patch:
              update-types:
                  - "minor"
                  - "patch"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          github-actions:
              patterns:
                  - "*"
